[package]
name = "hn-desktop"
version = "1.2.0"
edition = "2024"
publish = false
description = "Native desktop frontend for hn, built on Rune"
license = "MIT"
repository = "https://github.com/Shaance/hn"

# Its own workspace root, so this crate never joins the `hn` package at the repo root and
# never touches the root Cargo.toml or Cargo.lock. The root pins rustc 1.88; Rune needs 1.99.1.
[workspace]

[lib]
name = "hn_desktop"
path = "src/lib.rs"

[[bin]]
name = "hn-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
crossterm = { version = "0.29", default-features = false }
hn-reader = { path = ".." }
rune = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289", features = ["tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }

# The live article pane: a wry `WKWebView` hosted as a child of the Rune window, the pattern
# `prototypes/rune-webview` proved at this pin. macOS-only, so `cargo metadata` resolves on
# Linux and Windows without webkit2gtk or WebView2 build requirements; the pane there falls
# back to the extracted text.
[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.57"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSView", "NSWindow", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }

# Rune's own workspace does the same: debug info for wgpu/winit/parley is dead weight.
[profile.dev.package."*"]
debug = false

# Rune's patched adapters/text/backend crates are required by its current source APIs.
# A dependency's workspace patches do not propagate to this desktop workspace.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289" }
naga = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289" }
winit = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "86df731b7171f52c9918f288784dda6ed0327289" }
